# Everything you need to run the app:  docker compose up --build
# Works without a .env file. Copy .env.example to .env if you want to change ports or passwords.
# The ports are different from the Online Library project, so both can run at the same time.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-attendance}
      MYSQL_USER: ${DB_USER:-attendance}
      MYSQL_PASSWORD: ${DB_PASSWORD:-attendance}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: ${APP_TIMEZONE:-Asia/Jakarta}
    ports:
      - "${DB_PORT:-3308}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Catches every email the app sends. Open http://localhost:8026 to read them.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8026}:8025"

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 8100
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      APP_URL: ${DOCKER_APP_URL:-http://localhost:3100}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-attendance}
      DB_USER: ${DB_USER:-attendance}
      DB_PASSWORD: ${DB_PASSWORD:-attendance}
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      INVITE_VALID_DAYS: ${INVITE_VALID_DAYS:-3}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SMTP_HOST: ${DOCKER_SMTP_HOST:-mailpit}
      SMTP_PORT: ${DOCKER_SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Attendance <no-reply@attendance.local>}
    ports:
      - "${API_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8100/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-3100}:80"

volumes:
  db-data:
