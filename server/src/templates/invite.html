<!DOCTYPE html>
<html lang="en">
<body style="margin:0;background:#eef1f4;font-family:Helvetica,Arial,sans-serif;color:#17212b">
  <div style="max-width:520px;margin:32px auto;background:#ffffff;border:1px solid #d7dde3;border-radius:8px;padding:28px">
    <p style="margin:0 0 20px;font-size:18px;font-weight:700;color:#0e6b66">Attendance</p>
    <p style="margin:0 0 12px">Hi {{name}},</p>
    <p style="margin:0 0 20px;line-height:1.6">
      An account has been created for you. Choose a password to start clocking in.
    </p>
    <a href="{{link}}" style="display:inline-block;background:#0e6b66;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:6px">
      Set my password
    </a>
    <p style="margin:20px 0 0;font-size:13px;color:#5b6875;line-height:1.6">
      This link works until {{expires}}. If the button doesn't work, paste this into your browser:<br />
      <span style="color:#17212b;word-break:break-all">{{link}}</span>
    </p>
  </div>
</body>
</html>
